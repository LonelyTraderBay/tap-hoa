name: tap-hoa

services:
  db:
    image: postgres:16-alpine
    container_name: tap-hoa-prod-db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - tap_hoa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    image: tap-hoa-api:prod
    container_name: tap-hoa-prod-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3040}:3000"

volumes:
  tap_hoa_postgres_data:
    name: tap_hoa_postgres_data
